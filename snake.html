<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐍 Змейка</title>
    <style>
        body { font-family: Arial; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; touch-action: none; }
        h1 { color: #4CAF50; margin: 10px; }
        .score { font-size: 20px; margin-bottom: 10px; }
        canvas { background: #000; border: 3px solid #4CAF50; border-radius: 10px; touch-action: none; }
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; margin-top: 15px; }
        .btn { background: #333; color: #4CAF50; border: 2px solid #4CAF50; border-radius: 8px; height: 60px; font-size: 24px; font-weight: bold; cursor: pointer; }
        .btn:active { background: #4CAF50; color: #000; }
        .btn.empty { visibility: hidden; }
        .gameover { position: absolute; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 2px solid #ff5252; text-align: center; display: none; }
        .gameover h2 { color: #ff5252; margin: 0 0 15px 0; }
        .restart { padding: 10px 25px; background: #4CAF50; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .back { position: absolute; top: 15px; left: 15px; color: #888; text-decoration: none; }
    </style>
</head>
<body>
    <a href="/files" class="back">← Назад</a>
    <h1>🐍 Змейка</h1>
    <div class="score">Счёт: <span id="score">0</span></div>
    <canvas id="canvas" width="300" height="300"></canvas>
    
    <div class="controls">
        <div class="btn empty"></div>
        <button class="btn" onclick="setDir(0,-1)">↑</button>
        <div class="btn empty"></div>
        <button class="btn" onclick="setDir(-1,0)">←</button>
        <button class="btn" onclick="setDir(0,1)">↓</button>
        <button class="btn" onclick="setDir(1,0)">→</button>
    </div>

    <div class="gameover" id="gameover">
        <h2>💀 Игра окончена!</h2>
        <p>Ваш счёт: <b id="finalScore">0</b></p>
        <button class="restart" onclick="restart()">Играть снова</button>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 15;
    const tileCount = canvas.width / gridSize;

    let snake, food, dir, nextDir, score, gameLoop;

    function init() {
        snake = [{x: 10, y: 10}];
        dir = {x: 0, y: 0};
        nextDir = {x: 0, y: 0};
        score = 0;
        document.getElementById('score').innerText = score;
        document.getElementById('gameover').style.display = 'none';
        spawnFood();
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, 150);
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // Не спавнить еду на змейке
        if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
    }

    function update() {
        if (dir.x === 0 && dir.y === 0) return;

        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        // Столкновение со стеной
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            return gameOver();
        }
        // Столкновение с собой
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            return gameOver();
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('score').innerText = score;
            spawnFood();
        } else {
            snake.pop();
        }

        dir = nextDir;
        draw();
    }

    function draw() {
        // Фон
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Сетка
        ctx.strokeStyle = '#222';
        for (let i = 0; i <= tileCount; i++) {
            ctx.beginPath();
            ctx.moveTo(i * gridSize, 0);
            ctx.lineTo(i * gridSize, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * gridSize);
            ctx.lineTo(canvas.width, i * gridSize);
            ctx.stroke();
        }

        // Еда
        ctx.fillStyle = '#ff5252';
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
        ctx.fill();

        // Змейка
        snake.forEach((s, i) => {
            ctx.fillStyle = i === 0 ? '#4CAF50' : '#2e7d32';
            ctx.fillRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });
    }

    function setDir(x, y) {
        // Нельзя разворачиваться на 180 градусов
        if (dir.x === -x && dir.y === -y) return;
        nextDir = {x, y};
    }

    function gameOver() {
        clearInterval(gameLoop);
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameover').style.display = 'block';
    }

    function restart() {
        init();
    }

    // Управление стрелками
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') setDir(0, -1);
        if (e.key === 'ArrowDown') setDir(0, 1);
        if (e.key === 'ArrowLeft') setDir(-1, 0);
        if (e.key === 'ArrowRight') setDir(1, 0);
    });

    // Свайпы для тача
    let touchStart = null;
    canvas.addEventListener('touchstart', e => touchStart = e.touches[0]);
    canvas.addEventListener('touchend', e => {
        if (!touchStart) return;
        const dx = e.changedTouches[0].clientX - touchStart.clientX;
        const dy = e.changedTouches[0].clientY - touchStart.clientY;
        if (Math.abs(dx) > Math.abs(dy)) {
            setDir(dx > 0 ? 1 : -1, 0);
        } else {
            setDir(0, dy > 0 ? 1 : -1);
        }
        touchStart = null;
    });

    init();
</script>
</body>
</html>
