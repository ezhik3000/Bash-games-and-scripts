<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎮 Тетрис</title>
    <style>
        body { font-family: Arial; background: #121212; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; touch-action: none; overflow: hidden; }
        h1 { color: #4CAF50; margin: 5px; font-size: 22px; }
        .stats { display: flex; gap: 20px; margin-bottom: 10px; font-size: 14px; }
        .stats div { background: #1e1e1e; padding: 8px 12px; border-radius: 5px; border: 1px solid #333; }
        .container { display: flex; gap: 15px; align-items: flex-start; }
        canvas { background: #000; border: 2px solid #4CAF50; border-radius: 5px; }
        #nextCanvas { background: #000; border: 2px solid #555; border-radius: 5px; }
        .controls { display: grid; grid-template-columns: repeat(4, 55px); gap: 5px; margin-top: 10px; }
        .btn { background: #333; color: #4CAF50; border: 2px solid #4CAF50; border-radius: 8px; height: 55px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:active { background: #4CAF50; color: #000; }
        .gameover { position: absolute; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 2px solid #ff5252; text-align: center; display: none; z-index: 10; }
        .gameover h2 { color: #ff5252; margin: 0 0 15px 0; }
        .restart { padding: 10px 25px; background: #4CAF50; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .back { position: absolute; top: 15px; left: 15px; color: #888; text-decoration: none; }
        .next-label { color: #888; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <a href="/files" class="back">← Назад</a>
    <h1>🎮 Тетрис</h1>
    
    <div class="stats">
        <div>Счёт: <span id="score">0</span></div>
        <div>Линии: <span id="lines">0</span></div>
        <div>Уровень: <span id="level">1</span></div>
    </div>

    <div class="container">
        <canvas id="canvas" width="200" height="400"></canvas>
        <div>
            <div class="next-label">Следующая:</div>
            <canvas id="nextCanvas" width="80" height="80"></canvas>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="move(-1)">←</button>
        <button class="btn" onclick="rotate()">↻</button>
        <button class="btn" onclick="move(1)">→</button>
        <button class="btn" onclick="drop()">↓</button>
    </div>

    <div class="gameover" id="gameover">
        <h2>💀 Игра окончена!</h2>
        <p>Ваш счёт: <b id="finalScore">0</b></p>
        <button class="restart" onclick="restart()">Играть снова</button>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nctx = nextCanvas.getContext('2d');
    
    const COLS = 10, ROWS = 20, BLOCK = 20;

    const COLORS = [null, '#00f0f0', '#0000f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000'];
    
    const SHAPES = [
        [],
        [[1,1,1,1]],                       // I
        [[1,0,0],[1,1,1]],                 // J
        [[0,0,1],[1,1,1]],                 // L
        [[1,1],[1,1]],                     // O
        [[0,1,1],[1,1,0]],                 // S
        [[0,1,0],[1,1,1]],                 // T
        [[1,1,0],[0,1,1]]                  // Z
    ];

    let board, piece, nextPiece, score, lines, level, dropInterval, gameOverFlag;

    function newBoard() {
        return Array.from({length: ROWS}, () => Array(COLS).fill(0));
    }

    function randomPiece() {
        const type = Math.floor(Math.random() * 7) + 1;
        return {
            type,
            shape: SHAPES[type].map(r => [...r]),
            x: Math.floor((COLS - SHAPES[type][0].length) / 2),
            y: 0
        };
    }

    function init() {
        board = newBoard();
        piece = randomPiece();
        nextPiece = randomPiece();
        score = 0; lines = 0; level = 1;
        dropInterval = 800;
        gameOverFlag = false;
        document.getElementById('score').innerText = 0;
        document.getElementById('lines').innerText = 0;
        document.getElementById('level').innerText = 1;
        document.getElementById('gameover').style.display = 'none';
        draw();
        drawNext();
        loop();
    }

    let lastTime = 0;
    function loop(time = 0) {
        if (gameOverFlag) return;
        if (time - lastTime > dropInterval) {
            tick();
            lastTime = time;
        }
        requestAnimationFrame(loop);
    }

    function tick() {
        piece.y++;
        if (collide()) {
            piece.y--;
            merge();
            clearLines();
            piece = nextPiece;
            nextPiece = randomPiece();
            drawNext();
            if (collide()) {
                gameOver();
                return;
            }
        }
        draw();
    }

    function collide() {
        for (let y = 0; y < piece.shape.length; y++) {
            for (let x = 0; x < piece.shape[y].length; x++) {
                if (piece.shape[y][x]) {
                    const ny = piece.y + y;
                    const nx = piece.x + x;
                    if (ny >= ROWS || nx < 0 || nx >= COLS || (ny >= 0 && board[ny][nx])) return true;
                }
            }
        }
        return false;
    }

    function merge() {
        piece.shape.forEach((row, y) => {
            row.forEach((val, x) => {
                if (val && piece.y + y >= 0) {
                    board[piece.y + y][piece.x + x] = piece.type;
                }
            });
        });
    }

    function clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
            if (board[y].every(v => v !== 0)) {
                board.splice(y, 1);
                board.unshift(Array(COLS).fill(0));
                cleared++;
                y++;
            }
        }
        if (cleared > 0) {
            lines += cleared;
            const points = [0, 100, 300, 500, 800];
            score += points[cleared] * level;
            document.getElementById('lines').innerText = lines;
            document.getElementById('score').innerText = score;
            const newLevel = Math.floor(lines / 10) + 1;
            if (newLevel > level) {
                level = newLevel;
                document.getElementById('level').innerText = level;
                dropInterval = Math.max(100, 800 - (level - 1) * 70);
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Сетка
        ctx.strokeStyle = '#222';
        for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i*BLOCK,0); ctx.lineTo(i*BLOCK, canvas.height); ctx.stroke(); }
        for (let i = 0; i <= ROWS; i++) { ctx.beginPath(); ctx.moveTo(0,i*BLOCK); ctx.lineTo(canvas.width, i*BLOCK); ctx.stroke(); }

        // Доска
        board.forEach((row, y) => {
            row.forEach((val, x) => {
                if (val) drawBlock(ctx, x, y, COLORS[val]);
            });
        });

        // Фигура
        piece.shape.forEach((row, y) => {
            row.forEach((val, x) => {
                if (val) drawBlock(ctx, piece.x + x, piece.y + y, COLORS[piece.type]);
            });
        });
    }

    function drawBlock(c, x, y, color) {
        c.fillStyle = color;
        c.fillRect(x*BLOCK + 1, y*BLOCK + 1, BLOCK - 2, BLOCK - 2);
        c.fillStyle = 'rgba(255,255,255,0.3)';
        c.fillRect(x*BLOCK + 1, y*BLOCK + 1, BLOCK - 2, 3);
    }

    function drawNext() {
        nctx.fillStyle = '#000';
        nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        const shape = nextPiece.shape;
        const size = 16;
        const offsetX = (nextCanvas.width - shape[0].length * size) / 2;
        const offsetY = (nextCanvas.height - shape.length * size) / 2;
        shape.forEach((row, y) => {
            row.forEach((val, x) => {
                if (val) {
                    nctx.fillStyle = COLORS[nextPiece.type];
                    nctx.fillRect(offsetX + x*size, offsetY + y*size, size - 1, size - 1);
                }
            });
        });
    }

    function move(dx) {
        if (gameOverFlag) return;
        piece.x += dx;
        if (collide()) piece.x -= dx;
        draw();
    }

    function rotate() {
        if (gameOverFlag) return;
        const old = piece.shape;
        const rotated = old[0].map((_, i) => old.map(row => row[i]).reverse());
        piece.shape = rotated;
        if (collide()) piece.shape = old;
        draw();
    }

    function drop() {
        if (gameOverFlag) return;
        piece.y++;
        if (collide()) {
            piece.y--;
        }
        draw();
    }

    function gameOver() {
        gameOverFlag = true;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameover').style.display = 'block';
    }

    function restart() {
        init();
    }

    // Клавиатура
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') move(-1);
        if (e.key === 'ArrowRight') move(1);
        if (e.key === 'ArrowDown') drop();
        if (e.key === 'ArrowUp' || e.key === ' ') rotate();
    });

    init();
</script>
</body>
</html>
